# Elo5 — ACL do Mosquitto (P1: princípio do menor privilégio)
# ESP publica sensores/estado e só assina o próprio comando.
user elo5-esp
topic read elo5/armazem-b/cmd
topic write elo5/armazem-b/state
topic write elo5/armazem-b/alarm
topic write elo5/armazem-b/log
topic write elo5/armazem-b/sensors
topic write elo5/armazem-b/status

# Bridge lê tudo do prefixo elo5 e publica comandos.
user elo5-bridge
topic read elo5/#
topic write elo5/+/cmd
