# Elo5 — Mosquitto local (P1: broker próprio com auth + ACL)
# Uso:
#   mosquitto -c mosquitto/mosquitto.conf
#   # ou via docker: docker run -p 1883:1883 -p 8883:8883 -v ./mosquitto:/mosquitto/config eclipse-mosquitto
#
# 1) Crie usuários (fora do repo, senhas nunca commitadas):
#      mosquitto_passwd -c mosquitto/passwd elo5-esp
#      mosquitto_passwd mosquitto/passwd elo5-bridge
# 2) Aponte o ESP (build flags) e a bridge (.env):
#      MQTT_SERVER=127.0.0.1 MQTT_PORT=1883 MQTT_USER=elo5-esp MQTT_PASSWORD=...
#      MQTT_URL=mqtt://127.0.0.1:1883 MQTT_USERNAME=elo5-bridge MQTT_PASSWORD=...
# 3) Para TLS (recomendado em rede real), gere certs e descomente as linhas TLS abaixo.

listener 1883 127.0.0.1
protocol mqtt
allow_anonymous false
password_file ./mosquitto/passwd
acl_file ./mosquitto/acl.conf

# --- TLS (P2 cutover ativo: 8883 com CA própria; 1883 localhost p/ migração) ---
listener 8883 0.0.0.0
protocol mqtt
cafile ./mosquitto/ca.crt
certfile ./mosquitto/server.crt
keyfile ./mosquitto/server.key
require_certificate false

persistence true
persistence_location ./mosquitto/data/
autosave_interval 300
connection_messages true
log_type all
