[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 500
  metric_buffer_limit = 5000
  flush_interval = "2s"

# --- OUTPUT: InfluxDB v2 ---
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "SuperSecretTokenSecurity2026=="
  organization = "seguranca_patrimonial"
  bucket = "armazem_telemetria"

# --- INPUT 1: Telemetria Periódica dos Sensores ---
[[inputs.mqtt_consumer]]
  servers = ["tcp://broker.hivemq.com:1883"]
  topics = ["elo5/armazem-b/sensors"]
  qos = 0
  connection_timeout = "30s"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "security_sensors"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pir"
      type = "bool"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "dist"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ldr"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ldr_anomaly"
      type = "bool"

# --- INPUT 2: Estado da Máquina de Estados ---
[[inputs.mqtt_consumer]]
  servers = ["tcp://broker.hivemq.com:1883"]
  topics = ["elo5/armazem-b/state"]
  qos = 0
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "security_state"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "armed"
      type = "bool"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "alarm"
      type = "bool"

# --- INPUT 3: Disparos de Alarme ---
[[inputs.mqtt_consumer]]
  servers = ["tcp://broker.hivemq.com:1883"]
  topics = ["elo5/armazem-b/alarm"]
  qos = 0
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "security_events"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "type"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      type = "int"